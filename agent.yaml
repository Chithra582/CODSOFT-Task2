spec_version: "0.1.0"
name: "codsoft-landingpage-agent"
version: "1.0.0"
description: "Autonomous gourmet dessert e-commerce landing page agent providing product catalog navigation, promotional pricing calculations, and customer inquiry routing."
author: "Chithra R"
license: "MIT"

model:
  preferred: "gemini-2.0-flash"
  fallback:
    - "gpt-4o-mini"
    - "claude-3-5-sonnet"
  constraints:
    temperature: 0.2
    max_tokens: 4096

skills:
  - product-catalog-retrieval
  - pricing-offer-calculator
  - inquiry-order-routing

tools:
  - get-flavour-catalog
  - calculate-order-offer
  - submit-customer-inquiry

compliance:
  risk_tier: standard
  frameworks:
    - gdpr
  data_governance:
    pii_handling: redact
    data_classification: internal
    consent_required: false
    cross_border: true
    bias_testing: false
  recordkeeping:
    audit_logging: true
    log_format: structured_json
    retention_period: 1y
    immutable: true
  supervision:
    human_in_the_loop: conditional
    override_capability: true
    kill_switch: true

tags:
  - "developer-tools"
  - "retail-and-ecommerce"
  - "landing-page"
  - "dessert-shop"
  - "front-end"

metadata:
  domain: "developer-tools"
  category: "Developer tools"
